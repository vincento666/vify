[project]
name = "hify"
version = "0.0.1"
description = "Hify Python FastAPI replica"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.48,<0.49",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.14,<2.15",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.18,<1.19",
    "PyMySQL>=1.2,<1.3",
    "psycopg[binary]>=3.3,<3.4",
    "pgvector>=0.4,<0.5",
    "redis>=8.0,<8.1",
    "httpx>=0.28,<0.29",
    "tenacity>=9.1,<9.2",
    "orjson>=3.11,<3.12",
    "structlog>=25.5,<26",
    "prometheus-client>=0.25,<0.26",
    "python-multipart>=0.0.20,<0.1",
    "pypdf>=6.12.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<9.1",
    "pytest-asyncio>=1.4,<1.5",
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
